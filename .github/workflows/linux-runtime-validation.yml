name: Linux runtime validation
on:
  push:
    branches: [main, 'wip/linux50-20261114']
    paths: ['source/**', '.github/workflows/linux-runtime-validation.yml']
  pull_request:
    paths: ['source/**', '.github/workflows/linux-runtime-validation.yml']
  workflow_dispatch:
concurrency:
  group: linux-runtime-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  linux-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: source
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      MAKEFLAGS: ''
      MFLAGS: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install host compiler and Vulkan loader headers
        run: sudo apt-get update && sudo apt-get install -y clang lld libvulkan-dev make binutils mesa-vulkan-drivers vulkan-validationlayers
      - name: Verify source, public headers and exact engine
        run: |
          python3 scripts/verify-source.py
          python3 scripts/build-linux-runtime-ci.py --validate-inputs
          python3 scripts/restore-engine.py
      - name: Check real versioned ELF link contracts
        run: |
          python3 scripts/resource_runner.py --rss-mib 512 --available-mib 6144 --nice 10 --seconds 180 --lock build/linux-interface-check.lock -- \
            python3 -m unittest discover -s scripts/tests -p test_linux_runtime_ci.py -v
      - name: Compile the isolated Linux runtime with one compiler
        run: |
          python3 scripts/resource_runner.py --rss-mib 4096 --available-mib 6144 --nice 10 --seconds 900 --lock build/developer-build.lock -- \
            python3 scripts/build-linux-runtime-ci.py
          python3 scripts/verify-source.py
      - name: Check queue synchronization and snapshot publication
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:quarantine_size_mb=16
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          LP_NUM_THREADS: '1'
        run: |
          mkdir -p build/queue-checks
          python3 scripts/resource_runner.py --rss-mib 512 --available-mib 6144 --nice 10 --seconds 120 --lock build/queue-checks.lock -- \
            clang -O1 -g -Wall -Wextra -Werror -std=c11 -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I third_party/windows-build-headers-v202/vulkan/include engine/tools/test_queue_guard.c \
            engine/runtime/nvn/vulkan/queue_guard.c -lpthread -o build/queue-checks/cpu
          python3 scripts/resource_runner.py --rss-mib 512 --available-mib 6144 --nice 10 --seconds 120 --lock build/queue-checks.lock -- build/queue-checks/cpu
          python3 scripts/resource_runner.py --rss-mib 512 --available-mib 6144 --nice 10 --seconds 120 --lock build/queue-checks.lock -- \
            clang -O1 -g -Wall -Wextra -Werror -std=c11 -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I third_party/windows-build-headers-v202/vulkan/include -I engine/runtime/nvn/vulkan \
            tests/vulkan_queue_host_sync.c engine/runtime/nvn/vulkan/queue_guard.c -lvulkan -lpthread -o build/queue-checks/gpu
          sst_lvp_icd=$(find /usr/share/vulkan/icd.d -name '*lvp*' -print -quit)
          test -n "$sst_lvp_icd"
          export VK_ICD_FILENAMES="$sst_lvp_icd" VK_DRIVER_FILES="$sst_lvp_icd"
          python3 scripts/resource_runner.py --rss-mib 512 --available-mib 6144 --nice 10 --seconds 120 --lock build/queue-checks.lock -- build/queue-checks/gpu
          python3 scripts/resource_runner.py --rss-mib 512 --available-mib 6144 --nice 10 --seconds 120 --lock build/queue-checks.lock -- \
            python3 -m unittest discover -s scripts/tests -p test_fixture_json.py -v
      - name: Preserve runtime and static validation receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-runtime-${{ github.sha }}
          path: source/build/linux-runtime-ci/artifacts/
          if-no-files-found: error
          retention-days: 7
