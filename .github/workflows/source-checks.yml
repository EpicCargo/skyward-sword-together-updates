name: Source and co-op checks

on:
  push:
    branches: [main]
    paths: ['source/**', '.github/workflows/source-checks.yml']
  pull_request:
    paths: ['source/**', '.github/workflows/source-checks.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: source
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      MAKEFLAGS: ''
      MFLAGS: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: Verify the source snapshot and restore the pinned engine
        run: |
          python3 scripts/verify-source.py
          python3 scripts/restore-engine.py
      - name: Build asset-free native checks and networking prerequisites
        run: |
          make -C client -j1 CC=clang \
            build/prop_state_test build/prop_roster_test build/prop_net_test \
            build/prop_host_test build/session_lifecycle_test \
            build/carry_transport_test build/presence_frame_test \
            build/scene_incarnation_test build/scene_transport_test \
            build/rejoin_test build/remote_frame_test build/motion_queue_test \
            build/enemy_motion_merge_test build/pickup_net_test \
            build/sst-session-host build/host_fixture
      - name: Check native prop, carry and session behavior
        run: |
          for check in prop_state_test prop_roster_test prop_net_test prop_host_test \
            session_lifecycle_test carry_transport_test presence_frame_test \
            scene_incarnation_test scene_transport_test rejoin_test remote_frame_test \
            motion_queue_test enemy_motion_merge_test pickup_net_test; do
            "client/build/$check"
          done
          python3 client/tests/session_host_test.py client/build/sst-session-host
      - name: Check the actual engine bridge and object-capacity regressions
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          mkdir -p build/source-checks
          python3 validation/check_paused_baseline.py
          python3 validation/check_pause_baseline.py
          python3 validation/check_scene_baseline.py
          python3 validation/check_discovery_baseline.py
          python3 validation/check_admission_baseline.py
          python3 validation/check_session_baseline.py
          python3 validation/check_context_baseline.py
          python3 validation/check_owner_baseline.py
          python3 validation/check_model_baseline.py
          flags=(-O1 -g -Wall -Wextra -std=c11 -D_GNU_SOURCE
            -fsanitize=address,undefined -fno-omit-frame-pointer)
          clang "${flags[@]}" -Wno-unused-function -ffunction-sections -fdata-sections \
            -Wl,--gc-sections -I engine/runtime tests/prop_bridge_roster_test.c \
            client/src/sst_props.c client/src/sst_world.c -lpthread -lm \
            -o build/source-checks/prop-bridge
          build/source-checks/prop-bridge
          clang "${flags[@]}" -Wno-unused-function -ffunction-sections -fdata-sections \
            -Wl,--gc-sections -I engine/runtime tests/prop_bridge_presentation_test.c \
            client/src/sst_props.c client/src/sst_world.c -lpthread -lm \
            -o build/source-checks/prop-presentation
          build/source-checks/prop-presentation
          clang "${flags[@]}" -Wno-unused-function -ffunction-sections -fdata-sections \
            -Wl,--gc-sections -I engine/runtime tests/prop_bridge_handoff_test.c \
            client/src/sst_props.c client/src/sst_world.c -lpthread -lm \
            -o build/source-checks/prop-handoff
          build/source-checks/prop-handoff
          clang "${flags[@]}" -Wno-unused-function -ffunction-sections -fdata-sections \
            -Wl,--gc-sections -I engine/runtime tests/prop_bridge_disconnect_test.c \
            client/src/sst_props.c client/src/sst_world.c -lpthread -lm \
            -o build/source-checks/prop-disconnect
          for mode in {1..23}; do build/source-checks/prop-disconnect "$mode"; done
          clang "${flags[@]}" -Wno-unused-function -ffunction-sections -fdata-sections \
            -Wl,--gc-sections -I engine/runtime tests/prop_bridge_pause_test.c \
            client/src/sst_props.c client/src/sst_world.c -lpthread -lm \
            -o build/source-checks/prop-pause
          for mode in {1..7}; do build/source-checks/prop-pause "$mode"; done
          clang "${flags[@]}" -Wno-unused-function -ffunction-sections -fdata-sections \
            -Wl,--gc-sections -I engine/runtime tests/prop_bridge_departure_test.c \
            client/src/sst_props.c client/src/sst_world.c -lpthread -lm \
            -o build/source-checks/prop-departure
          for mode in {1..9}; do build/source-checks/prop-departure "$mode"; done
          clang "${flags[@]}" -Wno-unused-function -ffunction-sections -fdata-sections \
            -Wl,--gc-sections -I engine/runtime tests/prop_bridge_discovery_loss_test.c \
            client/src/sst_props.c client/src/sst_world.c -lpthread -lm \
            -o build/source-checks/prop-discovery-loss
          for mode in {1..14}; do build/source-checks/prop-discovery-loss "$mode"; done
          clang "${flags[@]}" -Wno-unused-function -ffunction-sections -fdata-sections \
            -Wl,--gc-sections -I engine/runtime tests/prop_bridge_admission_test.c \
            client/src/sst_props.c client/src/sst_world.c -lpthread -lm \
            -o build/source-checks/prop-admission
          for mode in {1..12}; do build/source-checks/prop-admission "$mode"; done
          clang "${flags[@]}" -Wno-unused-function -ffunction-sections -fdata-sections \
            -Wl,--gc-sections -I engine/runtime tests/prop_bridge_session_test.c \
            client/src/sst_props.c client/src/sst_world.c -lpthread -lm \
            -o build/source-checks/prop-session
          for mode in {1..10}; do build/source-checks/prop-session "$mode"; done
          clang "${flags[@]}" -Wno-unused-function -ffunction-sections -fdata-sections \
            -Wl,--gc-sections -I engine/runtime tests/prop_bridge_context_test.c \
            client/src/sst_props.c client/src/sst_world.c -lpthread -lm \
            -o build/source-checks/prop-context
          for mode in {1..16}; do build/source-checks/prop-context "$mode"; done
          clang "${flags[@]}" -Wno-unused-function -ffunction-sections -fdata-sections \
            -Wl,--gc-sections -I engine/runtime tests/prop_bridge_owner_test.c \
            client/src/sst_props.c client/src/sst_world.c -lpthread -lm \
            -o build/source-checks/prop-owner
          for mode in {1..18}; do build/source-checks/prop-owner "$mode"; done
          clang "${flags[@]}" -Wno-unused-function -ffunction-sections -fdata-sections \
            -Wl,--gc-sections -I engine/runtime tests/prop_bridge_model_test.c \
            client/src/sst_props.c client/src/sst_world.c -lpthread -lm \
            -o build/source-checks/prop-model
          for mode in {1..14}; do build/source-checks/prop-model "$mode"; done
          clang "${flags[@]}" -Wno-unused-function -ffunction-sections -fdata-sections \
            -Wl,--gc-sections -I engine/runtime tests/prop_bridge_binding_test.c \
            client/src/sst_props.c client/src/sst_world.c -lpthread -lm \
            -o build/source-checks/prop-bindings
          for mode in 1 2 3 4 5 6 7; do build/source-checks/prop-bindings "$mode"; done
          clang "${flags[@]}" -I client/src validation/prop_capacity_test.c \
            client/src/sst_props.c -lm -o build/source-checks/prop-capacity
          for mode in 1 2 3; do build/source-checks/prop-capacity "$mode"; done
          clang "${flags[@]}" -fsyntax-only -I engine/runtime engine/runtime/hle/sst_world.c
          clang "${flags[@]}" -Wno-unused-function -ffunction-sections -fdata-sections \
            -Wl,--gc-sections engine/tools/test_shader_bounds.c -lm \
            -o build/source-checks/shader-bounds
          for mode in {1..12}; do build/source-checks/shader-bounds "$mode"; done
          clang "${flags[@]}" engine/tools/test_shader_program_size.c \
            engine/runtime/nvn/maxwell/translate.c -lm \
            -o build/source-checks/shader-program-size
          build/source-checks/shader-program-size
          clang "${flags[@]}" -Werror engine/tools/test_texture_cbuf.c \
            -o build/source-checks/texture-cbuf
          build/source-checks/texture-cbuf
          clang "${flags[@]}" engine/tools/test_bindless_texture.c -lm \
            -o build/source-checks/bindless-texture
          build/source-checks/bindless-texture
          clang "${flags[@]}" -Werror engine/tools/test_input_script.c \
            -o build/source-checks/input-script
          build/source-checks/input-script
          clang "${flags[@]}" -Werror engine/tools/test_vk_device_select.c \
            -o build/source-checks/vk-device-select
          build/source-checks/vk-device-select
          clang "${flags[@]}" -Werror -I validation tests/owned_prop_census_test.c \
            -lm -o build/source-checks/owned-prop-census
          build/source-checks/owned-prop-census
      - name: Check the launcher and actual local HTTP and TLS networking
        run: python3 -m unittest discover -s launcher/tests -v
      - name: Check build and packaging tools
        run: |
          (cd engine && python3 tools/test_build_game.py)
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 -m unittest discover -s scripts/tests -v
          python3 -O -m unittest discover -s launcher/tests -p test_bundle_seed.py -v
          python3 -O -m unittest discover -s scripts/tests -p test_engine_patchset.py -v
          python3 -O -m unittest discover -s scripts/tests -p test_restore_engine.py -v
          python3 -O -m unittest discover -s scripts/tests -p test_support_import.py -v
          python3 -O -m unittest discover -s scripts/tests -p test_windows_runtime_ci.py -v
          python3 -O -m unittest discover -s tests -p test_observation_stream.py -v
          python3 -O -m unittest discover -s tests -p test_windows_telemetry.py -v
          python3 -O -m unittest discover -s tests -p test_native_capture_gate.py -v
          python3 -O -m unittest discover -s tests -p test_expected_disconnect.py -v
          python3 scripts/check-source-archive.py
      - name: Check the room relay
        run: node --experimental-loader ./server/rooms/test/cloudflare-loader.mjs --test server/rooms/test/worker.test.mjs
      - name: Verify source files remain unchanged
        run: python3 scripts/verify-source.py

  windows-runtime:
    needs: source-tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: source
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      MAKEFLAGS: ''
      MFLAGS: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify build sources and reconstruct the pinned engine
        run: |
          python3 scripts/verify-source.py
          python3 scripts/build-windows-runtime-ci.py --validate-inputs
          python3 scripts/restore-engine.py
      - name: Cross-build only the Windows runtime with one compiler
        run: |
          python3 scripts/resource_runner.py --rss-mib 4096 --available-mib 6144 \
            --nice 10 --lock build/developer-build.lock -- \
            python3 scripts/build-windows-runtime-ci.py
          python3 scripts/verify-source.py
      - name: Preserve the asset-free runtime validation artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-runtime-${{ github.sha }}
          path: source/build/windows-runtime-ci/artifacts/
          if-no-files-found: error
          retention-days: 7
