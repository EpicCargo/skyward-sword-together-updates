name: Source and co-op checks

on:
  push:
    branches: [main]
    paths: ['source/**', '.github/workflows/source-checks.yml']
  pull_request:
    paths: ['source/**', '.github/workflows/source-checks.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: source
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      MAKEFLAGS: ''
      MFLAGS: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: Verify the source snapshot and restore the pinned engine
        run: |
          python3 scripts/verify-source.py
          python3 scripts/restore-engine.py
      - name: Build asset-free native checks and networking prerequisites
        run: |
          make -C client -j1 CC=clang \
            build/prop_state_test build/prop_roster_test build/prop_net_test \
            build/prop_host_test build/session_lifecycle_test \
            build/carry_transport_test build/presence_frame_test \
            build/sst-session-host build/host_fixture
      - name: Check native prop, carry and session behavior
        run: |
          for check in prop_state_test prop_roster_test prop_net_test prop_host_test \
            session_lifecycle_test carry_transport_test presence_frame_test; do
            "client/build/$check"
          done
          python3 client/tests/session_host_test.py client/build/sst-session-host
      - name: Check the actual engine bridge and object-capacity regressions
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          mkdir -p build/source-checks
          flags=(-O1 -g -Wall -Wextra -std=c11 -D_GNU_SOURCE
            -fsanitize=address,undefined -fno-omit-frame-pointer)
          clang "${flags[@]}" -Wno-unused-function -ffunction-sections -fdata-sections \
            -Wl,--gc-sections -I engine/runtime tests/prop_bridge_roster_test.c \
            client/src/sst_props.c client/src/sst_world.c -lpthread -lm \
            -o build/source-checks/prop-bridge
          build/source-checks/prop-bridge
          clang "${flags[@]}" -Wno-unused-function -ffunction-sections -fdata-sections \
            -Wl,--gc-sections -I engine/runtime tests/prop_bridge_presentation_test.c \
            client/src/sst_props.c client/src/sst_world.c -lpthread -lm \
            -o build/source-checks/prop-presentation
          build/source-checks/prop-presentation
          clang "${flags[@]}" -Wno-unused-function -ffunction-sections -fdata-sections \
            -Wl,--gc-sections -I engine/runtime tests/prop_bridge_handoff_test.c \
            client/src/sst_props.c client/src/sst_world.c -lpthread -lm \
            -o build/source-checks/prop-handoff
          build/source-checks/prop-handoff
          clang "${flags[@]}" -Wno-unused-function -ffunction-sections -fdata-sections \
            -Wl,--gc-sections -I engine/runtime tests/prop_bridge_disconnect_test.c \
            client/src/sst_props.c client/src/sst_world.c -lpthread -lm \
            -o build/source-checks/prop-disconnect
          python3 - <<'PY'
          import subprocess
          for mode, message in [(1, 'expect_position'), (4, 'sends == 0')]:
              p = subprocess.run(['build/source-checks/prop-disconnect', str(mode)], capture_output=True, text=True)
              print(p.stderr, end='')
              if p.returncode != -6 or message not in p.stderr:
                  raise SystemExit('Expected baseline defect was not reproduced: '+str(mode))
              print('BASELINE DEFECT REPRODUCED:', mode, flush=True)
          PY
          clang "${flags[@]}" -Wno-unused-function -ffunction-sections -fdata-sections \
            -Wl,--gc-sections -I engine/runtime tests/prop_bridge_binding_test.c \
            client/src/sst_props.c client/src/sst_world.c -lpthread -lm \
            -o build/source-checks/prop-bindings
          for mode in 1 2 3 4 5 6 7; do build/source-checks/prop-bindings "$mode"; done
          clang "${flags[@]}" -I client/src validation/prop_capacity_test.c \
            client/src/sst_props.c -lm -o build/source-checks/prop-capacity
          for mode in 1 2 3; do build/source-checks/prop-capacity "$mode"; done
          clang "${flags[@]}" -fsyntax-only -I engine/runtime engine/runtime/hle/sst_world.c
          clang "${flags[@]}" -Werror -I validation tests/owned_prop_census_test.c \
            -lm -o build/source-checks/owned-prop-census
          build/source-checks/owned-prop-census
      - name: Check the launcher and actual local HTTP and TLS networking
        run: python3 -m unittest discover -s launcher/tests -v
      - name: Check build and packaging tools
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 -m unittest discover -s scripts/tests -v
          python3 -O -m unittest discover -s launcher/tests -p test_bundle_seed.py -v
          python3 -O -m unittest discover -s scripts/tests -p test_engine_patchset.py -v
          python3 -O -m unittest discover -s scripts/tests -p test_restore_engine.py -v
          python3 scripts/check-source-archive.py
      - name: Check the room relay
        run: node --experimental-loader ./server/rooms/test/cloudflare-loader.mjs --test server/rooms/test/worker.test.mjs
      - name: Verify source files remain unchanged
        run: python3 scripts/verify-source.py
