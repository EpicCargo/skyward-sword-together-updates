name: Bindless prototype validation
on:
  push:
    branches: ['wip/bindless48-20261114']
  workflow_dispatch:
concurrency:
  group: bindless-prototype-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Restore the exact asset-free source
        run: python3 scripts/restore-engine.py
      - name: Check actual translation with sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          clang -O1 -g -std=c11 -D_GNU_SOURCE -fsanitize=address,undefined \
            -fno-omit-frame-pointer engine/tools/test_bindless_texture.c -lm -o /tmp/bindless-cpu
          /tmp/bindless-cpu
          clang -O1 -g -std=c11 -fsanitize=address,undefined \
            engine/tools/test_texture_cbuf.c -o /tmp/texture-cbuf
          /tmp/texture-cbuf
